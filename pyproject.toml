[project]
name = "iranio"
version = "0.1.0"
description = "A Python SDK for Iranian services integrations"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }

authors = [
    { name = "Foroozan Iraji", email = "fonij2002@gmail.com" }
]

keywords = [
    "iran",
    "sms",
    "api",
    "sdk",
    "kavenegar",
    "ghasedak",
    "smsir",
    "shabanic"
]


dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0"
]


[project.urls]

Homepage = "https://github.com/fonij2002/iranio"
Documentation = "https://fonij2002.github.io/iranio"
Repository = "https://github.com/fonij2002/iranio"


[dependency-groups]

dev = [
    "pytest>=8.0",
    "pytest-cov",
    "respx",
    "ruff",
    "mypy",
    "pre-commit"
]


[build-system]

requires = [
    "hatchling"
]

build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/iranio"
]